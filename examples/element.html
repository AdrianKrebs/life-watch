<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>life-watch element example</title>
		<!-- After publishing: https://cdn.jsdelivr.net/npm/life-watch/dist/life-watch.js -->
		<script type="module" src="../dist/life-watch.js"></script>
		<style>
			body { font-family: Georgia, serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #f7f2ed; }
		</style>
	</head>
	<body>
		<h1>My page</h1>
		<p>A compact live watch:</p>
		<life-watch name="Ada Byron" born="1995-12-10" metal="white" enamel="#1f4fa3" variant="embed"></life-watch>
		<p>And the full watch:</p>
		<life-watch name="Ada Byron" born="1995-12-10" metal="white" enamel="#1f4fa3" style="height: 640px"></life-watch>
	</body>
</html>
